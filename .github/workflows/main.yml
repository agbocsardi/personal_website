name: Publish to FTP

on:
  workflow_dispatch:  # Allow manual triggers
  push:
    branches:
      - main  # ONLY trigger on pushes to the deployment branch

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_PDS: ${{ secrets.BLUESKY_PDS }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Render Quarto Project
      uses: quarto-dev/quarto-actions/render@v2
      with:
        to: html
        path: .

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/
        local-dir: ./_site/

    # ── Bluesky cross-posting + comments ──────────────────────────────────
    - name: Install uv
      if: env.BLUESKY_HANDLE != ''
      uses: astral-sh/setup-uv@v5

    - name: Cross-post to Bluesky
      if: env.BLUESKY_HANDLE != ''
      run: uv run scripts/bluesky-publish.py

    - name: Commit and push Bluesky comments
      if: env.BLUESKY_HANDLE != ''
      env:
        REPO_PUSH_PAT: ${{ secrets.REPO_PUSH_PAT }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Only commit if there are changes
        if git diff --quiet && git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git add posts/
        git commit -m "Add Bluesky comments (bot)"
        git push "https://x-access-token:${REPO_PUSH_PAT}@github.com/${{ github.repository }}.git" main
